<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>You and Me</title>
<style>
:root { --bg:#fff5f8; --panel:#fff; --text:#5c4d4d; --pri:#ffa6c9; --other:#fff0f5; --self:#ffb7c5; --line:#ffe3ec; --self-text:#fff; }
* { box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); }
.phone { width:100vw; height:100vh; display:flex; flex-direction:column; position:relative; }
.header { height:70px; display:flex; justify-content:space-between; align-items:center; padding:15px; background:var(--panel); border-bottom:2px dashed var(--line); }
.header-center { display:flex; align-items:center; gap:8px; cursor:pointer;}
.avatar { width:40px; height:40px; border-radius:50%; background:#ffe3ec; background-size:cover; display:flex; justify-content:center; align-items:center; font-size:12px; border:2px solid #fff; }
.name { font-size:14px; font-weight:bold; }
.h-btn { color:var(--pri); font-size:22px; cursor:pointer; margin-left:15px;}

.chat-box { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:15px; }
.msg-row { display:flex; width:100%; align-items:flex-start; }
.msg-row.self { justify-content:flex-end; }
.msg-row.other { justify-content:flex-start; }
.msg-avatar { width:36px; height:36px; border-radius:50%; background:#ffe3ec; background-size:cover; display:flex; justify-content:center; align-items:center; font-size:12px; flex-shrink:0; }
.msg-row.self .msg-avatar { margin-left:8px; order:2; } 
.msg-row.self .msg-content { order:1; display:flex; justify-content:flex-end;} 
.msg-row.other .msg-avatar { margin-right:8px; order:1; } 
.msg-row.other .msg-content { order:2; display:flex; justify-content:flex-start;}

.bubble { padding:10px 14px; font-size:15px; max-width:70%; word-break:break-word; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
.msg-row.other .bubble { background:var(--other); border-radius:16px 16px 16px 4px; }
.msg-row.self .bubble { background:var(--self); color:var(--self-text); border-radius:16px 16px 4px 16px; }

.input-area { padding:10px 15px; padding-bottom:max(15px, env(safe-area-inset-bottom)); background:var(--panel); border-top:2px dashed var(--line); display:flex; gap:10px; align-items:center; }
.i-btn { color:var(--pri); font-size:20px; cursor:pointer; }
.in-box { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:8px 12px; }
.in-box input { width:100%; background:none; border:none; color:var(--text); outline:none; font-size:15px; }
.s-btn { width:32px; height:32px; border-radius:50%; background:var(--pri); color:#fff; border:none; cursor:pointer; font-weight:bold;}

.page { position:absolute; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:100; display:none; flex-direction:column; }
.page.show { display:flex; }
.p-head { height:50px; display:flex; align-items:center; padding:0 15px; color:var(--pri); border-bottom:1px solid var(--line); cursor:pointer; font-weight:bold;}
.p-body { padding:15px; flex:1; overflow-y:auto; }
.f-group { margin-bottom:15px; }
.f-group label { display:block; font-size:13px; margin-bottom:5px; }
.f-group input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; }
.f-group button { width:100%; padding:12px; background:var(--pri); color:#fff; border:none; border-radius:8px; font-weight:bold; }
</style>
</head>
<body>

<div class="phone">
    <div class="header">
        <div class="header-center" onclick="showPage('moodPage')">
            <div class="avatar" id="topAvatar">TA</div>
            <div class="name" id="topName">小猪 〉</div>
        </div>
        <div>
            <span class="h-btn" onclick="showPage('sysPage')">⚙️</span>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <div class="in-box"><input type="text" id="msgInput" placeholder="发消息..." onkeydown="if(event.key==='Enter') sendMsg()"></div>
        <button class="s-btn" onclick="sendMsg()">↑</button>
    </div>

    <!-- 角色设置页 -->
    <div id="moodPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>TA的名字</label><input type="text" id="inputName"></div>
            <div class="f-group">
                <label>我的头像</label>
                <input type="file" accept="image/*" onchange="uploadAv(event, 'self')">
            </div>
            <div class="f-group">
                <label>TA的头像</label>
                <input type="file" accept="image/*" onchange="uploadAv(event, 'other')">
            </div>
            <button onclick="saveMood()">保存设定</button>
        </div>
    </div>

    <!-- 系统设置页 -->
    <div id="sysPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>回复延迟(秒)</label><input type="number" id="setSpeed" value="2"></div>
            <button onclick="saveSys()">保存设置</button>
        </div>
    </div>
</div>

<script>
    let chat = JSON.parse(localStorage.getItem('c_data')) || [];
    let prof = JSON.parse(localStorage.getItem('c_prof')) || { name:'小猪', avatarOther:'', avatarSelf:'' };
    let speed = parseInt(localStorage.getItem('c_speed')) || 2;
    let defaultReplies = ['汪', '好喜欢你', '抱抱你', '在忙，等下回你。'];

    window.onload = () => {
        ui(); render();
        document.getElementById('inputName').value = prof.name;
        document.getElementById('setSpeed').value = speed;
    };

    const save = () => {
        localStorage.setItem('c_data', JSON.stringify(chat));
        localStorage.setItem('c_prof', JSON.stringify(prof));
        localStorage.setItem('c_speed', speed);
    };

    const ui = () => {
        document.getElementById('topName').innerText = prof.name + ' 〉';
        if(prof.avatarOther) {
            let topEl = document.getElementById('topAvatar');
            topEl.style.backgroundImage = `url(${prof.avatarOther})`; topEl.innerText = '';
        }
    };

    const showPage = (id) => { document.getElementById(id).classList.add('show'); };
    const hidePage = () => { document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); };

    const render = () => {
        const box = document.getElementById('chatBox');
        box.innerHTML = chat.map(m => {
            let avatarImg = m.isSelf ? prof.avatarSelf : prof.avatarOther;
            let avatarText = m.isSelf ? '我' : 'TA';
            let avatarHtml = `<div class="msg-avatar" style="background-image:url('${avatarImg}')">${avatarImg ? '' : avatarText}</div>`;
            let contentHtml = `<div class="bubble">${m.text}</div>`;
            return `<div class="msg-row ${m.isSelf?'self':'other'}">${avatarHtml}<div class="msg-content">${contentHtml}</div></div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    };

    const sendMsg = () => {
        let v = document.getElementById('msgInput').value.trim();
        if(!v) return;
        chat.push({ text:v, isSelf:true }); document.getElementById('msgInput').value='';
        save(); render();
        
        // 自动回复
        setTimeout(() => {
            let reply = defaultReplies[Math.floor(Math.random()*defaultReplies.length)];
            chat.push({ text:reply, isSelf:false });
            save(); render();
        }, speed * 1000);
    };

    const saveMood = () => {
        let n = document.getElementById('inputName').value;
        if(n) prof.name = n;
        save(); ui(); hidePage();
    };

    const uploadAv = (e, type) => {
        let r = new FileReader();
        r.onload = (ev) => { 
            if(type === 'self') prof.avatarSelf = ev.target.result;
            else prof.avatarOther = ev.target.result;
            save(); ui(); 
        };
        if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
    };

    const saveSys = () => {
        speed = parseInt(document.getElementById('setSpeed').value) || 2;
        save(); hidePage();
    };
</script>
</body>
</html>
